services:
  - type: web
    name: insect-database-system
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false 
      - key: DB_PASSWORD
        sync: false 
      - key: DB_DATABASE
        value: insect_db
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
