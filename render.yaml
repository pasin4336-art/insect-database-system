services:
  - type: web
    name: insect-database-system
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: insect_db
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        value: super-secret-key-for-insect-db-system-2026
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
